      - "🧳 Portabilidad de Prácticas": Recursos/PRACTICAS_PORTABILIDAD_ESTUDIANTE.md
      - "🧑‍🏫 Guía de Revisores": Recursos/PRACTICAS_GUIA_REVISORES.md
