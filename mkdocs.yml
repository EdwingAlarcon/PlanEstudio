site_name: "Power Platform & D365 — Plan de Estudio"
site_description: "Plan de aprendizaje progresivo: de cero a base laboral guiada en Power Platform y Dynamics 365 Customer Engagement"
docs_dir: docs
site_dir: site
exclude_docs: |
  superpowers/**

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    logo: material/school
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Inicio: index.md
  - "🟢 Nivel 1 — Básico":
      - Contenido: Niveles/NIVEL_1_BASICO.md
  - "🔵 Nivel 2 — Intermedio":
      - Contenido: Niveles/NIVEL_2_INTERMEDIO.md
  - "🟠 Nivel 3 — Avanzado":
      - Contenido: Niveles/NIVEL_3_AVANZADO.md
  - "🔴 Nivel 4 — Arquitecto":
      - Contenido: Niveles/NIVEL_4_ARQUITECTO.md
  - "🟣 Nivel IA — Desarrollo Asistido":
      - Contenido: Niveles/NIVEL_5_IA.md
  - "⚙️ Nivel RPA — Power Automate Desktop":
      - Contenido: Niveles/NIVEL_7_RPA.md
  - Anexos:
