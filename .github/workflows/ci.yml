name: CI / Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'SPRINT_HANDOFF.md'
      - 'CLAUDE.md'
      - 'HISTORIAL_CLAUDE.md'
      - 'graphify-out/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'SPRINT_HANDOFF.md'
      - 'CLAUDE.md'
      - 'HISTORIAL_CLAUDE.md'
      - 'graphify-out/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app-elearning

jobs:
  # ─── Lint & Type-check ──────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: app-elearning/.nvmrc
          cache: npm
          cache-dependency-path: app-elearning/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Validate content
        run: npm run validate:content

  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: app-elearning/.nvmrc
          cache: npm
          cache-dependency-path: app-elearning/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: app-elearning/coverage/

  # ─── E2E Smoke Tests ────────────────────────────────────────────────────────
  e2e:
    name: Playwright Smoke (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: app-elearning/.nvmrc
          cache: npm
          cache-dependency-path: app-elearning/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests (shard ${{ matrix.shard }}/3)
        run: npx playwright test --shard=${{ matrix.shard }}/3

  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [lint, test, e2e]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: app-elearning/.nvmrc
          cache: npm
          cache-dependency-path: app-elearning/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Mismo build que Vercel (producción oficial): sin basePath. El deploy lo hace Vercel desde master.
      - name: Build static export
        run: npm run build
