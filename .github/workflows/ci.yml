name: CI / Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'SPRINT_HANDOFF.md'
      - 'CLAUDE.md'
      - 'HISTORIAL_CLAUDE.md'
      - 'graphify-out/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'SPRINT_HANDOFF.md'
      - 'CLAUDE.md'
      - 'HISTORIAL_CLAUDE.md'
      - 'graphify-out/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app-elearning

jobs:
  # ─── Lint & Type-check ──────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: app-elearning/.nvmrc
          cache: npm
          cache-dependency-path: app-elearning/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Validate content
        run: npm run validate:content

  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: app-elearning/.nvmrc
          cache: npm
          cache-dependency-path: app-elearning/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: app-elearning/coverage/

  # ─── E2E Smoke Tests ────────────────────────────────────────────────────────
  e2e:
    name: Playwright Smoke (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Un shard sano tarda de 1,5 a 12 min; sin límite, un job colgado ocupa hasta 6 h (tope de GitHub).
    timeout-minutes: 25
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: app-elearning/.nvmrc
          cache: npm
          cache-dependency-path: app-elearning/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Caché del navegador: la descarga de Chromium en cada run fue donde se colgó un shard (2026-11-06).
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Con la caché acertada el navegador ya está; solo faltan las librerías del sistema.
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run smoke tests (shard ${{ matrix.shard }}/3)
        run: npx playwright test --shard=${{ matrix.shard }}/3

  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, e2e]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: app-elearning/.nvmrc
          cache: npm
          cache-dependency-path: app-elearning/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Mismo build que Vercel (producción oficial): sin basePath. El deploy lo hace Vercel desde master.
      - name: Build static export
        run: npm run build
