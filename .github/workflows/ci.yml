name: CI / Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'SPRINT_HANDOFF.md'
      - 'CLAUDE.md'
      - 'graphify-out/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'SPRINT_HANDOFF.md'
      - 'CLAUDE.md'
      - 'graphify-out/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app-elearning

jobs:
  # ─── Lint & Type-check ──────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: app-elearning/.nvmrc
          cache: npm
          cache-dependency-path: app-elearning/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Validate content
        run: npm run validate:content

  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: app-elearning/.nvmrc
          cache: npm
          cache-dependency-path: app-elearning/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: app-elearning/coverage/

  # ─── E2E Smoke Tests ────────────────────────────────────────────────────────
  e2e:
    name: Playwright Smoke
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: app-elearning/.nvmrc
          cache: npm
          cache-dependency-path: app-elearning/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run e2e

  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [lint, test, e2e]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: app-elearning/.nvmrc
          cache: npm
          cache-dependency-path: app-elearning/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build:pages

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-out
          path: app-elearning/out/

  # ─── MkDocs Build (reference/legacy) ────────────────────────────────────────
  # MkDocs is kept as reference documentation. It is validated strictly so
  # broken legacy navigation or Markdown links do not drift unnoticed.
  mkdocs:
    name: MkDocs Build (legacy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MkDocs dependencies
        run: pip install -r requirements.txt
        working-directory: .

      - name: MkDocs build (strict)
        run: mkdocs build --strict
        working-directory: .

  # ─── Deploy to GitHub Pages ─────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, mkdocs]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: nextjs-out
          path: ./out

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
